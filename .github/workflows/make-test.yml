name: Run make test

on:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: '30 9 * * *'

jobs:
  build:
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          compiler: gcc
          compile_flags: ""
        - os: ubuntu-latest
          compiler: clang
          compile_flags: "-DFORCE_MONOTONIC_FIX"
        - os: macos-14
          compiler: clang
          compile_flags: ""
        - os: macos-13
          compiler: clang
          compile_flags: ""
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: make
      env:
        CC: ${{ matrix.compiler }}
        FAKETIME_COMPILE_CFLAGS: ${{ matrix.compile_flags }}
      run: make
    - name: make test
      run: make test
