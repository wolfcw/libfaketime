name: Run make test

on:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: '30 9 * * *'

jobs:
  build:
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          compiler: gcc
          compile_flags: ""
          sanitizer: false
        - os: ubuntu-latest
          compiler: clang
          compile_flags: "-DFORCE_MONOTONIC_FIX"
          sanitizer: false
        - os: macos-14
          compiler: clang
          compile_flags: ""
          sanitizer: false
        - os: macos-13
          compiler: clang
          compile_flags: ""
          sanitizer: false
        - os: macos-14
          compiler: clang
          compile_flags: "-DFAKE_FILE_TIMESTAMPS"
          sanitizer: false
        - os: ubuntu-latest
          compiler: gcc
          compile_flags: "-DFAKE_FILE_TIMESTAMPS"
          sanitizer: false
        - os: ubuntu-latest
          compiler: gcc
          compile_flags: "-DFAKE_PID"
          sanitizer: false
        - os: ubuntu-latest
          compiler: gcc
          compile_flags: "-DFAKE_RANDOM"
          sanitizer: false
        - os: ubuntu-latest
          compiler: gcc
          compile_flags: "-DINTERCEPT_SYSCALL"
          sanitizer: false
        - os: ubuntu-latest
          compiler: gcc
          compile_flags: ""
          sanitizer: true
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: make
      if: ${{ !matrix.sanitizer }}
      env:
        CC: ${{ matrix.compiler }}
        FAKETIME_COMPILE_CFLAGS: ${{ matrix.compile_flags }}
      run: make
    - name: make test
      if: ${{ !matrix.sanitizer }}
      run: make test
    - name: make test with sanitizers
      if: ${{ matrix.sanitizer }}
      env:
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        CC: ${{ matrix.compiler }}
        FAKETIME_COMPILE_CFLAGS: ${{ matrix.compile_flags }}
        CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        LDFLAGS: -fsanitize=address,undefined
      run: |
        ASAN_LIB=$(gcc -print-file-name=libasan.so)
        FAKETIME_TESTLIB="$ASAN_LIB:../src/libfaketime.so.1" make test

  musl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Pull Alpine baseline image
      run: docker pull alpine:3.20
    - name: make test on Alpine musl
      run: |
        set -o pipefail
        test/docker_baseline.sh alpine:3.20 2>&1 | tee alpine-baseline.log
    - name: Upload Alpine baseline log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: alpine-baseline-log
        path: alpine-baseline.log

  debian:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Pull Debian 13 baseline image
      run: docker pull debian:13
    - name: make test on Debian 13
      run: |
        set -o pipefail
        test/docker_baseline.sh debian:13 2>&1 | tee debian-baseline.log
    - name: Upload Debian baseline log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: debian-baseline-log
        path: debian-baseline.log

  archlinux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Pull Arch Linux baseline image
      run: docker pull archlinux:base-devel
    - name: make test on native Arch Linux
      run: |
        set -o pipefail
        test/docker_baseline.sh archlinux:base-devel 2>&1 | tee archlinux-baseline.log
    - name: Upload Arch Linux baseline log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: archlinux-baseline-log
        path: archlinux-baseline.log
