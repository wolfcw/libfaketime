name: Run make test

on:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: '30 9 * * *'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v1
    - name: make
      run: FAKETIME_COMPILE_CFLAGS="-DFORCE_MONOTONIC_FIX" make
    - name: make test
      run: make test

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make
    - name: make test
      run: make test
